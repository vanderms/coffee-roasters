<details
  #details
  [attr.aria-disabled]="isDisabled() ? true : undefined"
  class="mx-auto max-w-[45.625rem]"
>
  <summary
    [id]="id()"
    class="component:icon-accordion mx-0 flex cursor-pointer list-none items-center justify-between px-0"
  >
    <span
      class="heading-sm text-neutral-60 md:heading-md max-w-[15rem] md:max-w-none"
      >{{ label() }}</span
    >
    <app-icon name="expand" class="icon-expand"></app-icon>
  </summary>
  <div class="accordion-content mt-8 md:mt-10">
    <div
      class="flex flex-col gap-6 overflow-hidden md:flex-row md:justify-between md:gap-3"
    >
      @for (option of options(); track $index) {
        <label
          class="bg-neutral-20 hover:bg-secondary-30 text-neutral-80 grid cursor-pointer rounded-lg p-6 md:max-w-[14.25rem] md:px-7 md:pt-8 md:pb-[5.25rem]"
          [attr.data-active]="value() === option.title ? true : undefined"
        >
          <span class="heading-sm">{{ option.title }}</span>
          <span class="body-md mt-2">{{ option.text }}</span>
          <input
            type="radio"
            [name]="id()"
            class="h-0 w-0 overflow-clip opacity-5"
            (change)="handleChange(option.title)"
          />
        </label>
      }
    </div>
  </div>
</details>
